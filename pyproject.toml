[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="orbitforge-mission-lab"
version="1.0.0"
description="Orbital mechanics, mission analysis and spacecraft operations laboratory"
requires-python=">=3.11"
dependencies=["fastapi>=0.110","uvicorn>=0.27","pydantic>=2","sgp4>=2.21"]

[project.optional-dependencies]
test=["pytest>=8","httpx>=0.27"]

[project.scripts]
orbitforge="orbitforge.api.app:main"

[tool.setuptools.packages.find]
where=["src"]
